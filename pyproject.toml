[project]
name = "eval-pipeline"
version = "0.1.0"
description = "LLM eval pipeline: MMLU vs Claude models, modeled in dbt"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "datasets>=3.0.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "tenacity>=9.0.0",
    "typer>=0.13.0",
    "python-dotenv>=1.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["dbt/", "tests/fixtures/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: live API tests, skipped in CI"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
